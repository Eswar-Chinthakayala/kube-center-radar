<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#072920"/>
      <stop offset="70%" stop-color="#03180f"/>
      <stop offset="100%" stop-color="#010a06"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <circle cx="128" cy="128" r="128" fill="#010a06"/>
  <circle cx="128" cy="128" r="118" fill="url(#bg)"/>

  <!-- Outer ring -->
  <circle cx="128" cy="128" r="118" fill="none" stroke="#34d399" stroke-width="3" opacity="0.7"/>

  <!-- Inner accent ring -->
  <circle cx="128" cy="128" r="88" fill="none" stroke="#059669" stroke-width="1" opacity="0.4"/>

  <!-- K stroke -->
  <g filter="url(#glow)" stroke="#10b981" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- vertical bar of K -->
    <line x1="72" y1="72" x2="72" y2="184" stroke-width="18"/>
    <!-- upper diagonal of K -->
    <line x1="72" y1="128" x2="140" y2="72" stroke-width="18"/>
    <!-- lower diagonal of K -->
    <line x1="72" y1="128" x2="140" y2="184" stroke-width="18"/>
  </g>

  <!-- C stroke -->
  <g filter="url(#glow)">
    <path d="M184,85 A56,56 0 1,0 184,171" fill="none" stroke="#34d399" stroke-width="18" stroke-linecap="round"/>
  </g>
</svg>
