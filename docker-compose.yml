services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kubecenter
      POSTGRES_USER: kubecenter
      POSTGRES_PASSWORD: kubecenter_dev
    ports:
      - "25432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kubecenter"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "26379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: kubecenter
      RABBITMQ_DEFAULT_PASS: kubecenter_dev
    ports:
      - "25672:5672"
      - "25673:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    command: start-dev --import-realm --spi-import-realm-default-strategy=OVERWRITE_EXISTING
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/kubecenter
      KC_DB_USERNAME: kubecenter
      KC_DB_PASSWORD: kubecenter_dev
      KC_HTTP_PORT: 8080
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_LOG_LEVEL: INFO
      # SMTP — pulled from .env so credentials never land in source control
      KC_SMTP_FROM: ${SMTP_FROM}
      KC_SMTP_FROM_DISPLAY_NAME: ${SMTP_FROM_NAME}
      KC_SMTP_HOST: ${SMTP_HOST}
      KC_SMTP_PORT: ${SMTP_PORT}
      KC_SMTP_USER: ${SMTP_USER}
      KC_SMTP_PASSWORD: ${SMTP_PASSWORD}
      KC_SMTP_SSL: ${SMTP_SSL}
      KC_SMTP_STARTTLS: ${SMTP_STARTTLS}
    ports:
      - "28080:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import
      - ./keycloak/themes:/opt/keycloak/themes
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/realms/kube-center/.well-known/openid-configuration || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres_data:
